<script>
/* ===== HOW THIS FILE IS ORGANISED (read me first) =====
 1. DATA    - the MENU list and seed() hold the sample dishes, prices, staff and orders. Edit them to change the demo data.
 2. STORAGE - load()/save() keep everything in localStorage (this browser only, NOT an online database).
 3. VIEWS   - V.home, V.pos, V.stat ... each function returns the HTML for one section.
 4. ACTIONS - A.* runs when a button with data-a="name" is clicked; C.* runs when an input or select with data-c="name" changes.
 5. render() redraws the screen after every change.
===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'₹'+Number(n).toLocaleString('en-IN');

/* ---- Shared backend (Supabase) ---- config.js supplies the URL and public anon key. Without it the site runs in local demo mode. */

   Project URL, e.g. 'https://abcdxyz.supabase.co', and the PUBLISHABLE key (starts with sb_publishable_) or the legacy anon key.
   NEVER paste a secret key or service_role key here: this file is public. */
const SUPABASE_URL='',SUPABASE_PUBLISHABLE_KEY='';
const CFG=window.SR_CONFIG||{},clean=v=>String(v||'').replace(/^[\s"'`]+|[\s"'`]+$/g,''),RAWURL=clean(SUPABASE_URL||CFG.SUPABASE_URL),
BASE=(()=>{try{return RAWURL?new URL(RAWURL).origin:''}catch(e){return ''}})(),KEYA=clean(SUPABASE_PUBLISHABLE_KEY||CFG.SUPABASE_ANON_KEY);

function badKey(k){if(/^sb_secret_/.test(k))return true;if(!k.startsWith('eyJ'))return false;try{const r=JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role;return r!=='anon'&&r!=='authenticated'}catch(e){return true}}
const KEYBAD=badKey(KEYA),ONLINE=!!(/^https:\/\/[^\s\/]+/.test(BASE)&&KEYA&&!KEYBAD);
if(KEYBAD)console.error('Spice Route: a secret or service key was detected and is being ignored. Use only the publishable key.');
async function rpc(fn,args){const r=await fetch(BASE+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEYA,'Content-Type':'application/json',...(KEYA.startsWith('eyJ')?{Authorization:'Bearer '+KEYA}:{})},body:JSON.stringify(args)});if(!r.ok){let j={};try{j=await r.json()}catch(x){}const e=new Error(j.message||'HTTP '+r.status);e.code=j.code||'';e.status=r.status;console.error('Supabase '+fn+' failed:',r.status,j);throw e}return r.json()}
const rpcMsg=(e,w)=>{const d=DBG?' ['+(e.status||'')+' '+(e.code||'')+' '+String(e.message).slice(0,100)+']':'';
  return ((e.code=='22023'||e.code=='54000')?e.message:(e.code=='SHAPE'||e.code=='VERIFY')?'Your '+w+' could not be confirmed, so it was NOT saved. Please call the restaurant.':(e.code=='PGRST202'||e.status==404)?'Sorry, '+w+' is unavailable (database function missing). It was NOT saved. Please call the restaurant.':(e.status==401||e.status==403||e.code=='42501')?'The restaurant system refused this '+w+', so it was NOT saved. Please call the restaurant.':e.status?'Your '+w+' was NOT saved because of a server problem. Please try again.':'Could not send your '+w+'. Check your internet connection and try again.')+d};
const okPh=p=>/^[6-9][0-9]{9}$/.test(dg(p));
const CONN={s:ONLINE?'checking':'off',m:''};
const connMsg=e=>(!e.status&&!e.code)?'Cannot reach Supabase. Check the Project URL.':(e.status==401||e.status==403)?'Supabase rejected the key or the function is not permitted (check the publishable key; re-run supabase-setup.sql).':(e.code=='PGRST202'||e.status==404)?'Database functions are missing. Run supabase-setup.sql again.':'Unexpected reply: '+String(e.message).slice(0,120);
async function probe(){if(!ONLINE)return;try{const r=await rpc('my_orders',{p_refs:['ping']});if(!Array.isArray(r))throw Object.assign(new Error('my_orders did not return a list'),{code:'SHAPE'});CONN.s='ok';CONN.m=''}catch(e){CONN.s='bad';CONN.m=connMsg(e)}render()}
const connLabel=()=>!ONLINE?(DEMO?'⚪ Demo mode (nothing is sent)':'🔴 Not connected'):CONN.s=='ok'?'🟢 Connected to restaurant':CONN.s=='bad'?'🟠 Cannot reach restaurant system':'⚪ Checking connection…';
const demoNote=()=>ONLINE?(CONN.s=='bad'?'<div class="note" style="border:1px solid var(--bad)">⚠ <b>Cannot reach the restaurant system:</b> '+esc(CONN.m)+' Orders and bookings will not be saved.</div>':''):KEYBAD?'<div class="note" style="border:1px solid var(--bad)">⚠ <b>A secret key was found in the website settings and ignored.</b> Use only the publishable key.</div>':DEMO?'<div class="note">Demo mode (?demo=1): nothing is sent to the restaurant.</div>':'<div class="note" style="border:1px solid var(--bad)">⚠ <b>This website is not connected to the restaurant system.</b> Orders and bookings cannot be sent. Please call the restaurant.</div>';
function setStatus(o,st){o.status=st;if(st=='Completed'){o.paid=true;const c=S.cus.find(x=>x.id==o.cust);if(c&&!o.pts){o.pts=Math.floor(o.total/10);c.pts+=o.pts;c.v++}}}
let syncing=false;
async function sync(){if(!ONLINE||syncing)return;syncing=true;let ch=false;
  try{const refs=S.orders.filter(o=>o.ref).map(o=>o.ref),rr=S.res.filter(r=>r.ref).map(r=>r.ref);
    if(refs.length)(await rpc('my_orders',{p_refs:refs})).forEach(x=>{const o=S.orders.find(y=>y.ref==x.ref);if(o&&o.status!=x.status){setStatus(o,x.status);ch=true}});
    if(rr.length)(await rpc('my_bookings',{p_refs:rr})).forEach(x=>{const b=S.res.find(y=>y.ref==x.ref);if(b&&b.st!=x.status){b.st=x.status;ch=true}});
    if(ch){save();render()}}catch(e){}
  syncing=false}

gocart(){const e=$('#cartbox');if(e)e.scrollIntoView({behavior:'smooth'})},
add(i){const x=cart.find(c=>c.id==i);x?x.q++:cart.push({id:+i,q:1});toast(price(i).n+' added to your order');render()},
inc(i){cart.find(c=>c.id==i).q++;render()},
dec(i){const x=cart.find(c=>c.id==i);if(--x.q<1)cart=cart.filter(c=>c!==x);render()},
rm(i){cart=cart.filter(c=>c.id!=i);render()},
clear(){cart=[];ui.red=false;ui.disc=0;render()},
tochk(){if(!cart.length)return toast('Your cart is empty. Add a dish first.');A.nav('chk')},
pm(i){ui.pm=i;render()},
async checkout(){const n=ui.cn.trim();
  if(!cart.length)return toast('Your cart is empty.');
  if(n.length<2)return toast('Please enter your name.');
  if(!okPh(ui.cph))return toast('Please enter a valid 10 digit mobile number starting with 6, 7, 8 or 9.');
  if(!ui.pm)return toast('Please choose a payment method.');
  if(!ONLINE&&!DEMO)return toast(NOCONN);
  if(ui.busy)return;
  const c=member(ui.cph),rd=!ONLINE&&!!(c&&ui.red&&c.pts>=100),t=calc(cart,rd?10:0),table=ui.ot=='dine'?(+ui.tbl||1):0;let id={no:++S.ono};
  if(ONLINE){ui.busy=true;toast('Sending your order…');
    try{const r=await rpc('place_order',{p_name:n,p_phone:dg(ui.cph),p_type:ui.ot,p_table:table,p_pm:ui.pm,p_items:cart.map(i=>({id:i.id,q:i.q}))});if(!r||typeof r.ref!='string'||r.ref.length<8||!r.order_no)throw Object.assign(new Error('Unexpected reply from place_order'),{code:'SHAPE'});
    const v=await rpc('my_orders',{p_refs:[r.ref]});if(!Array.isArray(v)||!v.some(x=>x.ref==r.ref))throw Object.assign(new Error('Order not found after saving'),{code:'VERIFY'});
    id={no:r.order_no,ref:r.ref,tot:{sub:r.subtotal,disc:r.discount,tax:r.tax,total:r.total}}}
    catch(e){ui.busy=false;return toast(rpcMsg(e,'order'))}
    ui.busy=false}
  if(rd)c.pts-=100;
  const o=mk(cart.map(i=>({...i})),rd?10:0,Object.assign({table,t:Date.now(),status:'Received',paid:ui.pm!='cash',cust:c?c.id:0,mine:true,red:rd,name:n,phone:ui.cph,ot:ui.ot,pm:ui.pm},id));
  if(id.tot){Object.assign(o,id.tot);delete o.tot}S.orders.push(o);cart=[];ui.red=false;ui.done=o.no;save();toast('Order #'+o.no+' confirmed.');render();scrollTo(0,0)},
copyLink(){const l=menuLink();if(!l)return toast('Enter your published website address first.');
  const ok=()=>toast('Menu link copied.'),fb=()=>{const t=document.createElement('textarea');t.value=l;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('Copy failed. Please copy the link by hand.')}t.remove()};
  navigator.clipboard?navigator.clipboard.writeText(l).then(ok,fb):fb()},
dlQr(){const c=document.querySelector('#qr canvas');if(!c)return toast('The QR code is not ready yet.');const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='spice-route-menu-qr'+(ui.qt?'-table-'+ui.qt:'')+'.png';a.click()},
printQr(){window.print()},
saveSite(){const v=$('#su').value.trim();if(!/^https:\/\//i.test(v)||/claude\.ai|localhost|127\.0\.0\.1/i.test(v))return toast('Enter your live https address, e.g. https://your-name.github.io/restaurant-erp-pos/');S.site=v;save();toast('Website address saved.');render()},
edit(i){const o=S.orders.find(x=>x.no==i);if(!o||o.status!='Received')return;const c=S.cus.find(x=>x.id==o.cust);if(o.red&&c)c.pts+=100;
  cart=o.items.map(x=>({...x}));ui.tbl=o.table||1;ui.red=!!o.red;ui.disc=o.red?10:0;ui.cust=o.cust||'';ui.cph=o.phone||(c?c.ph:'');ui.cn=o.name||'';ui.ot=o.ot||'dine';ui.pm=o.pm||'';S.orders=S.orders.filter(x=>x!==o);save();view='pos';toast('Your items are back in the cart. Place the order again when ready.');render()},
cancel(i){const o=S.orders.find(x=>x.no==i);if(!o||o.status!='Received')return;const c=S.cus.find(x=>x.id==o.cust);if(o.red&&c)c.pts+=100;o.status='Cancelled';save();toast('Order #'+i+' cancelled.');render()},
kadv(i){const o=S.orders.find(x=>x.no==i),nx={Received:'Preparing',Preparing:'Ready',Ready:'Completed'};if(!o||!nx[o.status])return;setStatus(o,nx[o.status]);if(o.status=='Completed'&&o.pts)toast('Order completed. You earned '+o.pts+' reward points.');save();render()},
bill(i){const o=S.orders.find(x=>x.no==i);if(!o)return;const c=S.cus.find(x=>x.id==o.cust);
$('#modal').innerHTML=`<div class="modal"><div class="back" data-a="closeBill"></div><div class="rcpt"><h2>Spice Route</h2><div style="text-align:center">Bill #${o.no}</div><hr>
<div class="l"><span>Date</span><span>${new Date(o.t).toLocaleString('en-IN')}</span></div><div class="l"><span>Order for</span><span>${tl(o)}</span></div><div class="l"><span>Customer</span><span>${esc(o.name||(c?c.n:'Guest'))}</span></div><div class="l"><span>Payment</span><span>${payl(o)}</span></div><hr>
${o.items.map(x=>`<div class="l"><span>${x.q} × ${esc(price(x.id).n)}</span><span>${R(price(x.id).p*x.q)}</span></div>`).join('')}<hr>
<div class="l"><span>Subtotal</span><span>${R(o.sub)}</span></div><div class="l"><span>Rewards discount (${o.dp}%)</span><span>−${R(o.disc)}</span></div><div class="l"><span>GST 5%</span><span>${R(o.tax)}</span></div><div class="l"><b>Total</b><b>${R(o.total)}</b></div><hr>
<div style="text-align:center;font-size:11px">Demo bill. No real payment was taken.</div>
<div class="row noprint" style="margin:12px 0 0"><button class="btn" data-a="printBill">Print</button><button class="btn ghost" data-a="closeBill">Close</button></div></div></div>`},
closeBill(){$('#modal').innerHTML=''},
printBill(){window.print()},
async resAdd(){const n=$('#rn').value.trim(),p=$('#rp').value,d=$('#rd').value,t=$('#rt').value,g=Math.min(20,Math.max(1,+$('#rg').value||1)),rq=$('#rs').value.trim().slice(0,200);
  if(n.length<2)return toast('Please enter your name.');if(!okPh(p))return toast('Please enter a valid 10 digit mobile number starting with 6, 7, 8 or 9.');
  if(!d||d<iso(Date.now())||(d==iso(Date.now())&&t<new Date().toTimeString().slice(0,5)))return toast('Please choose a future date and time.');
  if(!ONLINE&&!DEMO)return toast(NOCONN);
  const b={id:nid(S.res),n,ph:p,g,d,t,rq,st:'Pending',mine:true};
  if(ONLINE){try{const r=await rpc('place_booking',{p_name:n,p_phone:dg(p),p_date:d,p_time:t,p_guests:g,p_requests:rq});
    if(!r||typeof r.ref!='string'||r.ref.length<8)throw Object.assign(new Error('Unexpected reply from place_booking'),{code:'SHAPE'});
    const v=await rpc('my_bookings',{p_refs:[r.ref]});if(!Array.isArray(v)||!v.some(x=>x.ref==r.ref))throw Object.assign(new Error('Booking not found after saving'),{code:'VERIFY'});b.ref=r.ref}
  catch(e){return toast(rpcMsg(e,'booking'))}}
  S.res.push(b);ui.rdone=b.id;save();toast('Booking request sent.');render();scrollTo(0,0)},
resCancel(i){S.res.find(r=>r.id==i).st='Cancelled';save();render()},
qrOrder(){if(ui.qt){ui.tbl=ui.qt;ui.ot='dine'}A.nav('pos')},
lookup(){const v=$('#lp').value,c=member(v);ui.lph=v;ui.me=c?c.id:0;if(!c)toast(dg(v).length<10?'Enter a 10 digit phone number.':'No member found with that number.');render()},
useMe(){const c=S.cus.find(x=>x.id==ui.me);if(!c)return;ui.cust=c.id;ui.cph=c.ph;A.nav('pos')},
cusAdd(){const n=$('#cn').value.trim(),p=$('#cp').value;if(!n)return toast('Please enter your name.');if(dg(p).length<10)return toast('Please enter a 10 digit phone number.');if(member(p))return toast('This number is already a member.');
  const c={id:nid(S.cus),n,ph:p,pts:0,v:0};S.cus.push(c);ui.me=c.id;ui.lph=p;save();toast('Welcome, '+n+'! You are now a member.');render()},
reset(){if(confirm('Clear all demo data saved in this browser?')){S=seed();cart=[];ui.cust='';ui.cph='';ui.red=false;ui.disc=0;ui.me=0;save();render();toast('Demo data cleared.')}}};
const C={
of(v,el){OW.f[el.dataset.k]=v;render()},ost(v,el){oSet(el.dataset.t,el.dataset.id,v)},
q(v){ui.q=v;render()},cnm(v){ui.cn=v;render()},ot(v){ui.ot=v;render()},vf(v){ui.vf=v;render()},tbl(v){ui.tbl=+v;render()},qt(v){ui.qt=+v;render()},
cph(v){ui.cph=v;const c=member(v);ui.cust=c?c.id:'';if(!c||c.pts<100){ui.red=false;ui.disc=0}render()},
red(v,el){ui.red=el.checked;ui.disc=ui.red?10:0;render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.i)});
document.addEventListener('input',e=>{const c=e.target.dataset.c;if(c&&e.target.type=='search')C[c](e.target.value,e.target)});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c&&e.target.type!='search')C[c](e.target.value,e.target)});
if(S.theme)document.documentElement.dataset.theme=S.theme;
try{const P=new URLSearchParams(location.search),t=+P.get('table');if(t>=1&&t<=10){ui.tbl=t;ui.qt=t;ui.ot='dine'}if(P.has('menu')||t>=1||location.hash=='#menu')view='pos';if(P.has('owner')||location.hash=='#owner')view='owner'}catch(e){}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='opw')A.oLogin()});
render();probe();if(view!='owner')sync();if(view=='owner'&&OW.tok&&ONLINE)oLoad().then(render).catch(()=>render());
</script>
</body>
</html>
