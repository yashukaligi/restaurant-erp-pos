   NEVER paste a secret key or service_role key here: this file is public. */
const SUPABASE_URL='',SUPABASE_PUBLISHABLE_KEY='';
const CFG=window.SR_CONFIG||{},BASE=(SUPABASE_URL||CFG.SUPABASE_URL||'').trim().replace(/\/$/,''),KEYA=(SUPABASE_PUBLISHABLE_KEY||CFG.SUPABASE_ANON_KEY||'').trim();
function badKey(k){if(/^sb_secret_/.test(k))return true;if(!k.startsWith('eyJ'))return false;try{const r=JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role;return r!=='anon'&&r!=='authenticated'}catch(e){return true}}

async function rpc(fn,args){const r=await fetch(BASE+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEYA,'Content-Type':'application/json',...(KEYA.startsWith('eyJ')?{Authorization:'Bearer '+KEYA}:{})},body:JSON.stringify(args)});if(!r.ok){let j={};try{j=await r.json()}catch(x){}const e=new Error(j.message||'HTTP '+r.status);e.code=j.code||'';e.status=r.status;console.error('Supabase '+fn+' failed:',r.status,j);throw e}return r.json()}

let syncing=false;
async function sync(){if(!ONLINE||syncing)return;syncing=true;let ch=false;
  try{const refs=S.orders.filter(o=>o.ref).map(o=>o.ref),rr=S.res.filter(r=>r.ref).map(r=>r.ref);
    if(refs.length)(await rpc('my_orders',{p_refs:refs})).forEach(x=>{const o=S.orders.find(y=>y.ref==x.ref);if(o&&o.status!=x.status){setStatus(o,x.status);ch=true}});

    if(ch){save();render()}}catch(e){}
  syncing=false}

/* QR menu: set SITE_URL near the top of this script to your GitHub Pages address, or type it on the QR Menu page. */

function menuLink(){let b=siteUrl().split(/[?#]/)[0];if(!b)return '';if(!/\/$|\.html$/.test(b))b+='/';return b+'?menu=1'+(ui.qt?'&table='+ui.qt:'')}

function render(){

  $('#side').innerHTML='<div class="brand">🌶 Spice Route<small>Order online · Dine in</small></div>'+NAV.map(x=>`<button class="nav ${x[0]==view?'on':''}" data-a="nav" data-i="${x[0]}">${x[1]} ${x[2]}${x[0]=='chk'&&n?`<span class="badge" style="margin-left:auto">${n}</span>`:''}</button>`).join('')+'<div class="sp"></div><button class="nav" data-a="reset">♻ Clear my demo data</button>';

const A={

  if(!ui.pm)return toast('Please choose a payment method.');

  cart=o.items.map(x=>({...x}));ui.tbl=o.table||1;ui.red=!!o.red;ui.disc=o.red?10:0;ui.cust=o.cust||'';ui.cph=o.phone||(c?c.ph:'');ui.cn=o.name||'';ui.ot=o.ot||'dine';ui.pm=o.pm||'';S.orders=S.orders.filter(x=>x!==o);save();view='pos';toast('Your items are back in the cart. Place the order again when ready.');render()},
cancel(i){const o=S.orders.find(x=>x.no==i);if(!o||o.status!='Received')return;const c=S.cus.find(x=>x.id==o.cust);if(o.red&&c)c.pts+=100;o.status='Cancelled';save();toast('Order #'+i+' cancelled.');render()},
kadv(i){const o=S.orders.find(x=>x.no==i),nx={Received:'Preparing',Preparing:'Ready',Ready:'Completed'};if(!o||!nx[o.status])return;setStatus(o,nx[o.status]);if(o.status=='Completed'&&o.pts)toast('Order completed. You earned '+o.pts+' reward points.');save();render()},
bill(i){const o=S.orders.find(x=>x.no==i);if(!o)return;const c=S.cus.find(x=>x.id==o.cust);
$('#modal').innerHTML=`<div class="modal"><div class="back" data-a="closeBill"></div><div class="rcpt"><h2>Spice Route</h2><div style="text-align:center">Bill #${o.no}</div><hr>
<div class="l"><span>Date</span><span>${new Date(o.t).toLocaleString('en-IN')}</span></div><div class="l"><span>Order for</span><span>${tl(o)}</span></div><div class="l"><span>Customer</span><span>${esc(o.name||(c?c.n:'Guest'))}</span></div><div class="l"><span>Payment</span><span>${payl(o)}</span></div><hr>
${o.items.map(x=>`<div class="l"><span>${x.q} × ${esc(price(x.id).n)}</span><span>${R(price(x.id).p*x.q)}</span></div>`).join('')}<hr>
<div class="l"><span>Subtotal</span><span>${R(o.sub)}</span></div><div class="l"><span>Rewards discount (${o.dp}%)</span><span>−${R(o.disc)}</span></div><div class="l"><span>GST 5%</span><span>${R(o.tax)}</span></div><div class="l"><b>Total</b><b>${R(o.total)}</b></div><hr>
<div style="text-align:center;font-size:11px">Demo bill. No real payment was taken.</div>
<div class="row noprint" style="margin:12px 0 0"><button class="btn" data-a="printBill">Print</button><button class="btn ghost" data-a="closeBill">Close</button></div></div></div>`},
closeBill(){$('#modal').innerHTML=''},
printBill(){window.print()},
async resAdd(){const n=$('#rn').value.trim(),p=$('#rp').value,d=$('#rd').value,t=$('#rt').value,g=Math.min(20,Math.max(1,+$('#rg').value||1)),rq=$('#rs').value.trim().slice(0,200);
  if(n.length<2)return toast('Please enter your name.');if(!okPh(p))return toast('Please enter a valid 10 digit mobile number starting with 6, 7, 8 or 9.');
  if(!d||d<iso(Date.now())||(d==iso(Date.now())&&t<new Date().toTimeString().slice(0,5)))return toast('Please choose a future date and time.');
  const b={id:nid(S.res),n,ph:p,g,d,t,rq,st:'Pending',mine:true};
  if(ONLINE){try{b.ref=(await rpc('place_booking',{p_name:n,p_phone:dg(p),p_date:d,p_time:t,p_guests:g,p_requests:rq})).ref}catch(e){return toast(rpcMsg(e,'booking'))}}
  S.res.push(b);ui.rdone=b.id;save();toast('Booking request sent.');render();scrollTo(0,0)},
resCancel(i){S.res.find(r=>r.id==i).st='Cancelled';save();render()},
qrOrder(){if(ui.qt){ui.tbl=ui.qt;ui.ot='dine'}A.nav('pos')},
lookup(){const v=$('#lp').value,c=member(v);ui.lph=v;ui.me=c?c.id:0;if(!c)toast(dg(v).length<10?'Enter a 10 digit phone number.':'No member found with that number.');render()},
useMe(){const c=S.cus.find(x=>x.id==ui.me);if(!c)return;ui.cust=c.id;ui.cph=c.ph;A.nav('pos')},
cusAdd(){const n=$('#cn').value.trim(),p=$('#cp').value;if(!n)return toast('Please enter your name.');if(dg(p).length<10)return toast('Please enter a 10 digit phone number.');if(member(p))return toast('This number is already a member.');
  const c={id:nid(S.cus),n,ph:p,pts:0,v:0};S.cus.push(c);ui.me=c.id;ui.lph=p;save();toast('Welcome, '+n+'! You are now a member.');render()},
reset(){if(confirm('Clear all demo data saved in this browser?')){S=seed();cart=[];ui.cust='';ui.cph='';ui.red=false;ui.disc=0;ui.me=0;save();render();toast('Demo data cleared.')}}};
const C={
q(v){ui.q=v;render()},cnm(v){ui.cn=v;render()},ot(v){ui.ot=v;render()},vf(v){ui.vf=v;render()},tbl(v){ui.tbl=+v;render()},qt(v){ui.qt=+v;render()},
cph(v){ui.cph=v;const c=member(v);ui.cust=c?c.id:'';if(!c||c.pts<100){ui.red=false;ui.disc=0}render()},
red(v,el){ui.red=el.checked;ui.disc=ui.red?10:0;render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.i)});
document.addEventListener('input',e=>{const c=e.target.dataset.c;if(c&&e.target.type=='search')C[c](e.target.value,e.target)});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c&&e.target.type!='search')C[c](e.target.value,e.target)});
if(S.theme)document.documentElement.dataset.theme=S.theme;
try{const P=new URLSearchParams(location.search),t=+P.get('table');if(t>=1&&t<=10){ui.tbl=t;ui.qt=t;ui.ot='dine'}if(P.has('menu')||t>=1||location.hash=='#menu')view='pos'}catch(e){}
render();sync();
</script>
